spring.application.name=ecocomunidade-api
spring.config.import=optional:file:./config/application-local.properties
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=10000
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=20000
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
app.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
